l="#2A3D2C"/><rect x="135.0" y="44" width="230" height="96" rx="18" fill="#2A3D2C" stroke="#2A3D2C" stroke-width="1.6"/><circle cx="620" cy="28" r="22" fill="#2A3D2C"/><rect x="505.0" y="44" width="230" height="96" rx="18" fill="#2A3D2C" stroke="#2A3D2C" stroke-width="1.6"/><rect x="80" y="240" width="780" height="120" rx="10" fill="#4A6550" stroke="#4A6550" stroke-width="1.6"/><rect x="80" y="440" width="300" height="140" rx="10" fill="#344B36" stroke="#344B36" stroke-width="1.6"/><path d="M470,442 a105.0,12 0 0,0 210,0 v136 a105.0,12 0 0,1 -210,0 z" fill="#4A6550" stroke="#4A6550"/><ellipse cx="575.0" cy="442" rx="105.0" ry="12" fill="#4A6550" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="1.4"/><path d="M712,452 a84.0,12 0 0,0 168,0 v116 a84.0,12 0 0,1 -168,0 z" fill="#4A6550" stroke="#4A6550"/><ellipse cx="796.0" cy="452" rx="84.0" ry="12" fill="#4A6550" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="1.4"/><rect x="940" y="250" width="180" height="100" rx="10" fill="#6E736A" stroke="#6E736A" stroke-width="1.6"/><text x="250.0" y="86.1" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Cliente</text><text x="250.0" y="111.9" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">[Persona]</text><text x="620.0" y="86.1" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Administrador</text><text x="620.0" y="111.9" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">[Persona]</text><text x="470.0" y="275.2" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Aplicación web (SPA)</text><text x="470.0" y="301.1" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">[Contenedor: HTML5, CSS3, JavaScript Vanilla con módulos ES, Bootstrap 5.3.3]</text><text x="470.0" y="321.6" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">Interfaz del cliente y panel de administración. Enrutador por hash, estado global en localStorage y un único</text><text x="470.0" y="337.4" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">cliente HTTP. Se entrega como archivos estáticos.</text><text x="230.0" y="478.0" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">API REST de MUGLY</text><text x="230.0" y="503.8" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">[Contenedor: Python 3.14, Flask 3.1,</text><text x="230.0" y="518.3" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">SQLAlchemy 2.0]</text><text x="230.0" y="538.8" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">Reglas de negocio, autenticación JWT y</text><text x="230.0" y="554.7" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">autorización por rol. Prefijo /api/v1.</text><text x="575.0" y="477.5" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Base de datos</text><text x="575.0" y="501.0" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">[Contenedor: MySQL 8.0 ·</text><text x="575.0" y="515.5" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">InnoDB · utf8mb4]</text><text x="575.0" y="535.0" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle">usuarios, perfiles,</text><text x="575.0" y="550.2" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle">productos, pedidos, detalles</text><text x="575.0" y="565.4" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle">e historial de estados</text><text x="796.0" y="475.8" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Almacén de</text><text x="796.0" y="494.3" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">imágenes</text><text x="796.0" y="517.8" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">[Carpeta</text><text x="796.0" y="532.3" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">backend/uploads]</text><text x="796.0" y="551.8" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle">Fotos de productos con</text><text x="796.0" y="567.0" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle">nombre UUID</text><text x="1030.0" y="294.1" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">WhatsApp</text><text x="1030.0" y="319.9" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">[Sistema externo]</text><rect x="198.8" y="186.8" width="102.4" height="18.3" rx="4" fill="#FFFFFF" fill-opacity=".94"/><text x="250.0" y="199.6" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#292929" text-anchor="middle">Usa [navegador]</text><rect x="568.8" y="186.8" width="102.4" height="18.3" rx="4" fill="#FFFFFF" fill-opacity=".94"/><text x="620.0" y="199.6" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#292929" text-anchor="middle">Usa [navegador]</text><rect x="120.3" y="383.7" width="219.4" height="32.6" rx="4" fill="#FFFFFF" fill-opacity=".94"/><text x="230.0" y="396.5" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#292929" text-anchor="middle">Peticiones fetch · JSON sobre HTTP</text><text x="230.0" y="410.8" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#292929" text-anchor="middle">Authorization: Bearer &lt;JWT&gt;</text><rect x="396.5" y="487.5" width="57.0" height="45.0" rx="4" fill="#FFFFFF" fill-opacity=".94"/><text x="425.0" y="499.8" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#292929" text-anchor="middle">SQL</text><text x="425.0" y="513.5" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#292929" text-anchor="middle">(ORM +</text><text x="425.0" y="527.1" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#292929" text-anchor="middle">PyMySQL)</text><rect x="354.8" y="630.9" width="330.3" height="18.3" rx="4" fill="#FFFFFF" fill-opacity=".94"/><text x="520.0" y="643.6" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#292929" text-anchor="middle">Guarda y sirve imágenes (JPG, PNG, WEBP · máx. 5 MB)</text><rect x="880.3" y="262.4" width="39.4" height="31.3" rx="4" fill="#FFFFFF" fill-opacity=".94"/><text x="900.0" y="274.6" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#292929" text-anchor="middle">Abre</text><text x="900.0" y="288.3" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#292929" text-anchor="middle">wa.me</text></svg>
