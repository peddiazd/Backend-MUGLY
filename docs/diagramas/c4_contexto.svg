<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-label="C4 nivel 1: diagrama de contexto de MUGLY" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif"><title>C4 nivel 1: diagrama de contexto de MUGLY</title><defs><marker id="c4_contexto-flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F5B66"/></marker><marker id="c4_contexto-abierta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#4F5B66" stroke-width="1.3"/></marker><marker id="c4_contexto-rombo" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" orient="auto-start-reverse"><path d="M1,5 L8,1 L15,5 L8,9 z" fill="#4F5B66"/></marker></defs><rect width="1040" height="600" fill="#FFFFFF"/><path d="M200,162 L200,302 L355,302" fill="none" stroke="#4F5B66" stroke-width="1.4" marker-end="url(#c4_contexto-flecha)"/><path d="M840,162 L840,302 L685,302" fill="none" stroke="#4F5B66" stroke-width="1.4" marker-end="url(#c4_contexto-flecha)"/><path d="M400,370 L400,412 L165,412 L165,465" fill="none" stroke="#4F5B66" stroke-width="1.4" marker-end="url(#c4_contexto-flecha)"/><path d="M520,465 L520,370" fill="none" stroke="#4F5B66" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#c4_contexto-flecha)"/><path d="M640,370 L640,412 L875,412 L875,465" fill="none" stroke="#4F5B66" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#c4_contexto-flecha)"/><circle cx="200" cy="34" r="22" fill="#183B47"/><rect x="80.0" y="50" width="240" height="112" rx="18" fill="#183B47" stroke="#183B47" stroke-width="1.6"/><circle cx="840" cy="34" r="22" fill="#183B47"/><rect x="715.0" y="50" width="250" height="112" rx="18" fill="#183B47" stroke="#183B47" stroke-width="1.6"/><rect x="355" y="235" width="330" height="135" rx="10" fill="#1F4E5F" stroke="#1F4E5F" stroke-width="1.6"/><rect x="40" y="465" width="250" height="110" rx="10" fill="#7C858D" stroke="#7C858D" stroke-width="1.6"/><rect x="395" y="465" width="250" height="110" rx="10" fill="#7C858D" stroke="#7C858D" stroke-width="1.6"/><rect x="750" y="465" width="250" height="110" rx="10" fill="#B9BFC4" stroke="#7C858D" stroke-width="1.6" stroke-dasharray="7 5"/><text x="200.0" y="73.3" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Cliente</text><text x="200.0" y="99.1" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">[Persona]</text><text x="200.0" y="119.7" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">Compra mugs del catálogo, paga</text><text x="200.0" y="135.5" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">por WhatsApp y sigue sus</text><text x="200.0" y="151.3" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">pedidos.</text><text x="840.0" y="73.3" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Administrador</text><text x="840.0" y="99.1" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">[Persona]</text><text x="840.0" y="119.7" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">Propietario del negocio: gestiona</text><text x="840.0" y="135.5" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">productos, inventario, pedidos,</text><text x="840.0" y="151.3" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">clientes y envíos.</text><text x="520.0" y="270.7" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">MUGLY</text><text x="520.0" y="300.5" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">[Sistema de software]</text><text x="520.0" y="321.0" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">Tienda virtual de mugs: catálogo, carrito,</text><text x="520.0" y="336.8" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">pedidos, inventario, clientes y envíos, con</text><text x="520.0" y="352.7" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">panel de administración.</text><text x="165.0" y="487.3" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">WhatsApp</text><text x="165.0" y="513.1" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">[Sistema externo]</text><text x="165.0" y="533.6" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">Canal del negocio (+57 313 361</text><text x="165.0" y="549.5" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">2247) para coordinar pagos y mugs</text><text x="165.0" y="565.3" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">personalizados.</text><text x="520.0" y="495.2" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Empresa de transporte</text><text x="520.0" y="521.0" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">[Servicio externo]</text><text x="520.0" y="541.6" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">Despacha el pedido y entrega el</text><text x="520.0" y="557.4" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">número de guía.</text><text x="875.0" y="495.2" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#2E3338" text-anchor="middle">Pasarela de pago</text><text x="875.0" y="521.0" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#2E3338" text-anchor="middle" font-style="italic">[Sistema externo · fuera de v1.0]</text><text x="875.0" y="541.6" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#2E3338" text-anchor="middle">RF21 diferido por la decisión D8.</text><text x="875.0" y="557.4" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#2E3338" text-anchor="middle">Sin integración en esta versión.</text><rect x="108.8" y="197.7" width="182.5" height="32.6" rx="4" fill="#FFFFFF" fill-opacity=".94"/><text x="200.0" y="210.5" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#2E3338" text-anchor="middle">Consulta el catálogo, compra</text><text x="200.0" y="224.8" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#2E3338" text-anchor="middle">y sigue sus pedidos [HTTP]</text><rect x="733.4" y="197.7" width="213.3" height="32.6" rx="4" fill="#FFFFFF" fill-opacity=".94"/><text x="840.0" y="210.5" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#2E3338" text-anchor="middle">Gestiona productos, inventario,</text><text x="840.0" y="224.8" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#2E3338" text-anchor="middle">pedidos, clientes y envíos [HTTP]</text><rect x="166.4" y="395.7" width="207.1" height="32.6" rx="4" fill="#FFFFFF" fill-opacity=".94"/><text x="270.0" y="408.5" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#2E3338" text-anchor="middle">Abre el chat (enlace wa.me) para</text><text x="270.0" y="422.8" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#2E3338" text-anchor="middle">pagar o pedir un personalizado</text><rect x="453.4" y="403.7" width="213.3" height="32.6" rx="4" fill="#FFFFFF" fill-opacity=".94"/><text x="560.0" y="416.5" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#2E3338" text-anchor="middle">Guía y transportadora registradas</text><text x="560.0" y="430.8" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#2E3338" text-anchor="middle">manualmente por el administrador</text><rect x="718.0" y="402.9" width="164.0" height="18.3" rx="4" fill="#FFFFFF" fill-opacity=".94"/><text x="800.0" y="415.6" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#2E3338" text-anchor="middle">Integración diferida (D8)</text></svg>
