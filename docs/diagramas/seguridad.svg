<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" role="img" aria-label="Diseño de seguridad: autenticación y autorización" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif"><title>Diseño de seguridad: autenticación y autorización</title><defs><marker id="seguridad-flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F5B52"/></marker><marker id="seguridad-abierta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#4F5B52" stroke-width="1.3"/></marker><marker id="seguridad-rombo" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" orient="auto-start-reverse"><path d="M1,5 L8,1 L15,5 L8,9 z" fill="#4F5B52"/></marker></defs><rect width="1180" height="560" fill="#FFFFFF"/><path d="M250,106 L290,106" fill="none" stroke="#4F5B52" stroke-width="1.4" marker-end="url(#seguridad-flecha)"/><path d="M500,106 L540,106" fill="none" stroke="#4F5B52" stroke-width="1.4" marker-end="url(#seguridad-flecha)"/><path d="M750,106 L800,106" fill="none" stroke="#4F5B52" stroke-width="1.4" marker-end="url(#seguridad-flecha)"/><path d="M250,276 L290,276" fill="none" stroke="#4F5B52" stroke-width="1.4" marker-end="url(#seguridad-flecha)"/><path d="M500,276 L540,276" fill="none" stroke="#4F5B52" stroke-width="1.4" marker-end="url(#seguridad-flecha)"/><path d="M750,276 L800,276" fill="none" stroke="#4F5B52" stroke-width="1.4" marker-end="url(#seguridad-flecha)"/><path d="M250,446 L290,446" fill="none" stroke="#4F5B52" stroke-width="1.4" marker-end="url(#seguridad-flecha)"/><path d="M500,446 L540,446" fill="none" stroke="#4F5B52" stroke-width="1.4" marker-end="url(#seguridad-flecha)"/><path d="M750,446 L800,446" fill="none" stroke="#4F5B52" stroke-width="1.4" marker-end="url(#seguridad-flecha)"/><rect x="40" y="56" width="210" height="100" rx="10" fill="#E6ECDD" stroke="#344B36" stroke-width="1.6"/><rect x="290" y="56" width="210" height="100" rx="10" fill="#E6ECDD" stroke="#344B36" stroke-width="1.6"/><rect x="540" y="56" width="210" height="100" rx="10" fill="#E6ECDD" stroke="#344B36" stroke-width="1.6"/><rect x="800" y="56" width="165" height="100" rx="10" fill="#DDEFE3" stroke="#2F6B3C" stroke-width="1.6"/><rect x="995" y="56" width="165" height="100" rx="10" fill="#F6E1DE" stroke="#A23B3B" stroke-width="1.6"/><rect x="40" y="226" width="210" height="100" rx="10" fill="#E6ECDD" stroke="#344B36" stroke-width="1.6"/><rect x="290" y="226" width="210" height="100" rx="10" fill="#E6ECDD" stroke="#344B36" stroke-width="1.6"/><rect x="540" y="226" width="210" height="100" rx="10" fill="#E6ECDD" stroke="#344B36" stroke-width="1.6"/><rect x="800" y="226" width="165" height="100" rx="10" fill="#DDEFE3" stroke="#2F6B3C" stroke-width="1.6"/><rect x="995" y="226" width="165" height="100" rx="10" fill="#F6E1DE" stroke="#A23B3B" stroke-width="1.6"/><rect x="40" y="396" width="210" height="100" rx="10" fill="#E6ECDD" stroke="#344B36" stroke-width="1.6"/><rect x="290" y="396" width="210" height="100" rx="10" fill="#E6ECDD" stroke="#344B36" stroke-width="1.6"/><rect x="540" y="396" width="210" height="100" rx="10" fill="#E6ECDD" stroke="#344B36" stroke-width="1.6"/><rect x="800" y="396" width="165" height="100" rx="10" fill="#DDEFE3" stroke="#2F6B3C" stroke-width="1.6"/><rect x="995" y="396" width="165" height="100" rx="10" fill="#F6E1DE" stroke="#A23B3B" stroke-width="1.6"/><text x="40.0" y="44.0" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#7A5C08" text-anchor="start">1 · REGISTRO</text><text x="145.0" y="89.9" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#292929" text-anchor="middle">POST /usuarios/registro</text><text x="145.0" y="112.4" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="400" fill="#292929" text-anchor="middle" font-style="italic">[RegistroUsuarioDTO]</text><text x="145.0" y="131.6" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#292929" text-anchor="middle">correo válido · contraseña ≥ 6</text><text x="395.0" y="85.2" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#292929" text-anchor="middle">UsuarioServicio</text><text x="395.0" y="107.7" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#292929" text-anchor="middle">correo único; hash con</text><text x="395.0" y="122.0" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#292929" text-anchor="middle">Werkzeug</text><text x="395.0" y="136.3" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#292929" text-anchor="middle">(generate_password_hash)</text><text x="645.0" y="92.4" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#292929" text-anchor="middle">MySQL</text><text x="645.0" y="114.9" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#292929" text-anchor="middle">Guarda el hash, nunca la</text><text x="645.0" y="129.1" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#292929" text-anchor="middle">contraseña · rol = usuario</text><text x="882.5" y="109.6" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#292929" text-anchor="middle">201 Creado</text><text x="980.0" y="110.0" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="700" fill="#6E736A" text-anchor="middle">o</text><text x="1077.5" y="101.4" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#292929" text-anchor="middle">400 datos inválidos</text><text x="1077.5" y="117.9" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#292929" text-anchor="middle">o correo repetido</text><text x="40.0" y="214.0" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#7A5C08" text-anchor="start">2 · INICIO DE SESIÓN</text><text x="145.0" y="262.4" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#292929" text-anchor="middle">POST /usuarios/login</text><text x="145.0" y="284.9" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#292929" text-anchor="middle">correo y contraseña</text><text x="145.0" y="299.1" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#292929" text-anchor="middle">obligatorios</text><text x="395.0" y="262.4" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#292929" text-anchor="middle">check_password_hash</text><text x="395.0" y="284.9" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#292929" text-anchor="middle">Compara con el hash; la cuenta</text><text x="395.0" y="299.1" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#292929" text-anchor="middle">debe estar activa</text><text x="645.0" y="262.4" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#292929" text-anchor="middle">JWT HS256</text><text x="645.0" y="284.9" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#292929" text-anchor="middle">Claims sub (id), iat y exp (15</text><text x="645.0" y="299.1" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#292929" text-anchor="middle">min); firmado con SECRET_KEY</text><text x="882.5" y="279.6" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#292929" text-anchor="middle">200 + access_token</text><text x="980.0" y="280.0" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="700" fill="#6E736A" text-anchor="middle">o</text><text x="1077.5" y="271.4" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#292929" text-anchor="middle">401 credenciales ·</text><text x="1077.5" y="287.9" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#292929" text-anchor="middle">403 desactivada</text><text x="40.0" y="384.0" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#7A5C08" text-anchor="start">3 · PETICIÓN PROTEGIDA</text><text x="145.0" y="422.8" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#292929" text-anchor="middle">Authorization: Bearer</text><text x="145.0" y="445.3" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="400" fill="#292929" text-anchor="middle" font-style="italic">[api.js lo agrega]</text><text x="145.0" y="464.5" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#292929" text-anchor="middle">Token tomado de estado.js</text><text x="145.0" y="478.7" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#292929" text-anchor="middle">(localStorage)</text><text x="395.0" y="425.2" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#292929" text-anchor="middle">@requiere_token</text><text x="395.0" y="447.7" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#292929" text-anchor="middle">Decodifica y verifica firma y</text><text x="395.0" y="462.0" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#292929" text-anchor="middle">expiración; usuario existe y</text><text x="395.0" y="476.3" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#292929" text-anchor="middle">activo</text><text x="645.0" y="425.2" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#292929" text-anchor="middle">@requiere_admin</text><text x="645.0" y="447.7" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#292929" text-anchor="middle">Lee el rol en la BD: exige</text><text x="645.0" y="462.0" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#292929" text-anchor="middle">admin para /admin/* y gestión</text><text x="645.0" y="476.3" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#292929" text-anchor="middle">de productos</text><text x="882.5" y="449.6" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#292929" text-anchor="middle">Controlador ejecuta</text><text x="980.0" y="450.0" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="700" fill="#6E736A" text-anchor="middle">o</text><text x="1077.5" y="441.4" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#292929" text-anchor="middle">401 sin token /</text><text x="1077.5" y="457.9" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#292929" text-anchor="middle">inválido · 403 rol</text><rect x="76.8" y="530.9" width="1026.4" height="18.3" rx="4" fill="#F3F6EF" fill-opacity=".94"/><text x="590.0" y="543.6" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#344B36" text-anchor="middle">La SPA oculta el panel a clientes (router.js), pero la autorización real está en el backend. Al recibir 401, api.js emite «mugly:sesion-invalida» y cierra la sesión.</text></svg>
