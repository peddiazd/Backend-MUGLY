FFF" text-anchor="middle" font-style="italic">DTO</text><text x="1015.0" y="40.9" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">PedidoServicio</text><text x="1015.0" y="62.7" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">servicio</text><text x="1160.0" y="40.9" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">MySQL</text><text x="1160.0" y="62.7" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">mugly_db</text><rect x="4.9" y="139.0" width="282.2" height="18.0" rx="4" fill="#FFFFFF" fill-opacity=".94"/><text x="146.0" y="151.6" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#2E3338" text-anchor="middle">1. Clic en «Confirmar pago» y acepta el modal</text><rect x="174.1" y="179.0" width="245.9" height="18.0" rx="4" fill="#FFFFFF" fill-opacity=".94"/><text x="297.0" y="191.6" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#2E3338" text-anchor="middle">2. cambiarEstado(1, {estado: &#x27;pagado&#x27;})</text><rect x="326.6" y="205.0" width="245.9" height="32.1" rx="4" fill="#FFFFFF" fill-opacity=".94"/><text x="449.5" y="217.5" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#2E3338" text-anchor="middle">3. PATCH /api/v1/admin/pedidos/1/estado</text><text x="449.5" y="231.6" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#2E3338" text-anchor="middle">Authorization: Bearer &lt;JWT&gt;</text><rect x="569.5" y="256.0" width="131.0" height="18.0" rx="4" fill="#FFFFFF" fill-opacity=".94"/><text x="635.0" y="268.6" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#2E3338" text-anchor="middle">4. jwt.decode(HS256)</text><rect x="687.3" y="284.0" width="312.4" height="18.0" rx="4" fill="#FFFFFF" fill-opacity=".94"/><text x="843.5" y="296.6" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#2E3338" text-anchor="middle">5. SELECT usuario → ¿existe, activo y rol = admin?</text><rect x="533.9" y="324.0" width="149.1" height="18.0" rx="4" fill="#FFFFFF" fill-opacity=".94"/><text x="608.5" y="336.6" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#2E3338" text-anchor="middle">6. llama con usuario_id</text><rect x="722.1" y="364.0" width="100.7" height="18.0" rx="4" fill="#FFFFFF" fill-opacity=".94"/><text x="772.5" y="376.6" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#2E3338" text-anchor="middle">7. load(cuerpo)</text><rect x="722.1" y="391.0" width="100.7" height="18.0" rx="4" fill="#FFFFFF" fill-opacity=".94"/><text x="772.5" y="403.6" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#2E3338" text-anchor="middle">datos validados</text><rect x="735.6" y="429.0" width="233.8" height="18.0" rx="4" fill="#FFFFFF" fill-opacity=".94"/><text x="852.5" y="441.6" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#2E3338" text-anchor="middle">8. cambiar_estado(1, admin_id, datos)</text><rect x="994.8" y="469.0" width="185.4" height="18.0" rx="4" fill="#FFFFFF" fill-opacity=".94"/><text x="1087.5" y="481.6" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#2E3338" text-anchor="middle">9. SELECT pedido … FOR UPDATE</text><rect x="1057.4" y="499.0" width="118.9" height="32.1" rx="4" fill="#FFFFFF" fill-opacity=".94"/><text x="1116.8" y="511.5" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#2E3338" text-anchor="middle">10. valida</text><text x="1116.8" y="525.6" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#2E3338" text-anchor="middle">pendiente → pagado</text><rect x="970.6" y="530.0" width="233.8" height="32.1" rx="4" fill="#FFFFFF" fill-opacity=".94"/><text x="1087.5" y="542.5" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#2E3338" text-anchor="middle">11. SELECT producto … FOR UPDATE</text><text x="1087.5" y="556.6" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#2E3338" text-anchor="middle">UPDATE cantidad_stock (tipo catálogo)</text><rect x="994.8" y="589.0" width="185.4" height="18.0" rx="4" fill="#FFFFFF" fill-opacity=".94"/><text x="1087.5" y="601.6" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#2E3338" text-anchor="middle">12. INSERT historial · COMMIT</text><rect x="793.1" y="619.0" width="118.9" height="18.0" rx="4" fill="#FFFFFF" fill-opacity=".94"/><text x="852.5" y="631.6" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#2E3338" text-anchor="middle">pedido serializado</text><rect x="414.1" y="669.0" width="233.8" height="18.0" rx="4" fill="#FFFFFF" fill-opacity=".94"/><text x="531.0" y="681.6" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#2E3338" text-anchor="middle">13. 200 {success: true, data: pedido}</text><rect x="279.9" y="699.0" width="34.2" height="18.0" rx="4" fill="#FFFFFF" fill-opacity=".94"/><text x="297.0" y="711.6" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#2E3338" text-anchor="middle">data</text><rect x="17.0" y="734.0" width="258.0" height="18.0" rx="4" fill="#FFFFFF" fill-opacity=".94"/><text x="146.0" y="746.6" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#2E3338" text-anchor="middle">14. Toast «Pedido #1 marcado como pagado»</text><text x="31.0" y="805.0" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#2E3338" text-anchor="start">Caminos alternos: sin token o token inválido → 401 · rol distinto de admin → 403 · cuerpo inválido → 400 (DTO) · transición no permitida o stock insuficiente → ROLLBACK y 400 · pedido</text><text x="31.0" y="819.9" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#2E3338" text-anchor="start">inexistente → 404.</text></svg>
